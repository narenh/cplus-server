# Deployment for Coolify (Docker Compose resource).
#
# No `image:` line: nothing is published to a registry, so Coolify builds from
# this repo.
#
# No `ports:` either — see the note on `expose` below. For running this on your
# own machine, docker-compose.override.yml adds the host port binding; Compose
# merges it automatically, and Coolify never sees it because Coolify invokes
# compose with an explicit `-f docker-compose.yml`.
#
services:
  cplus-service:
    build: .
    restart: unless-stopped

    environment:
      # Coolify replaces this with the domain you assign and wires up its proxy
      # and TLS certificate. The port belongs in the variable NAME, not the
      # value — `SERVICE_FQDN_<IDENTIFIER>_<PORT>` — and the value is the path
      # to route. Outside Coolify it is simply unset; the app never reads it.
      SERVICE_FQDN_CPLUS_8080: /

      # The one piece of real configuration that lives here rather than in the
      # web UI. Seerr decides who is admin, so whoever can name the Seerr
      # instance decides who gets in — that makes it a deploy-time secret-ish
      # setting, not a form field. Required: with it unset nobody can sign in.
      # Changing it signs out every device and browser on the next start.
      CPLUS_SEERR_URL: ${CPLUS_SEERR_URL:?set CPLUS_SEERR_URL to your Seerr base URL}

      # Where this service and the cplus-aligner sidecar below exchange
      # audiobook jobs. Remove it (and the sidecar) and the Audiobooks tab
      # says read-along isn't set up.
      CPLUS_ALIGN_DIR: /align

      # Everything else this needs before the web UI exists (listen port and
      # address, the SQLite path, log level, timezone) is baked into the image
      # itself — see the Dockerfile's own `ENV` — rather than repeated here.
      # None of it is a real per-deployment choice: two installs of this image
      # have no reason to disagree about where inside the container it listens
      # or where the SQLite file lives, and restating fixed values as
      # "environment variables" only grows the list Coolify asks you to review
      # on every deploy. If you genuinely need to override one (a non-default
      # `CPLUS_LOG_LEVEL` while debugging, say), add it here as an ordinary
      # `KEY: value` line same as the two above.

    # `expose`, not `ports`. Coolify's proxy reaches the container over the
    # Docker network, so publishing a host port is both unnecessary and
    # actively harmful: it binds 0.0.0.0:8080 on the host, which fails outright
    # if anything else already holds that port, and otherwise leaves the
    # service reachable bypassing the proxy and its TLS.
    expose:
      - "8080"

    volumes:
      # The whole of the service's state is the SQLite file in here: config,
      # users, profiles, actions, permissions, grabs, sessions. It must be a
      # real volume — a bind to an ephemeral path means every redeploy silently
      # resets the service to first-run.
      - cplus-data:/data
      - cplus-align:/align

    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:'+os.environ['CPLUS_PORT']+'/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Audiobook read-along: aligns an uploaded epub to a book's audio. The same
  # image in another role. Idle and tiny until an admin turns read-along on in
  # the Audiobooks tab, which downloads ~1.5 GB (the model and the runtime that
  # runs it) into the cplus-align volume once.
  #
  # It never sees the database or any Plex token: it gets jobs and audio from
  # cplus-service through the shared volume and an internal route.
  cplus-aligner:
    build: .
    command: ["aligner"]
    restart: unless-stopped
    environment:
      CPLUS_ALIGN_DIR: /align
    volumes:
      - cplus-align:/align
    # What a book in progress may use; between books it uses almost nothing.
    # Measured: ~2.1 GB while aligning (0.8 GB working memory plus 1.3 GB of
    # model weights read from disk). CPU sets the speed — at 3 CPUs a 20-hour
    # book takes about 4 hours — and the aligner also runs at low priority, so
    # anything else on the host wins when it needs the CPU.
    cpus: 3
    mem_limit: 2560m
    healthcheck:
      test: ["CMD", "python", "-c", "import json,sys,time; sys.exit(time.time()-json.load(open('/align/runtime/heartbeat.json'))['t']>60)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  cplus-data:
  # The aligner's runtime and model (~2.3 GB once read-along is on) and
  # in-progress jobs. Nothing here needs backing up: it can all be
  # re-downloaded, and finished alignments live in cplus-data.
  cplus-align:
