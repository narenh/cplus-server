# Deployment for Coolify (Docker Compose resource) and for a plain
# `docker compose up` on any host.
#
# No `image:` line: nothing is published to a registry, so both Coolify and a
# local compose build from this repo.

services:
  cplus-service:
    build: .
    container_name: cplus-service
    restart: unless-stopped

    environment:
      # Coolify replaces this with the domain you assign to the service and
      # wires up its proxy and TLS certificate. The `:8080` suffix tells it
      # which container port to route to. Outside Coolify it is simply unset
      # and unused — the app never reads it.
      SERVICE_FQDN_CPLUS: /:8080

      # Everything else — Seerr URL, Prowlarr connection, actions, quality
      # profiles, permissions — is configured in the web UI after first
      # launch, not here. These are only what must exist before the UI does.
      CPLUS_PORT: "8080"
      CPLUS_HOST: 0.0.0.0
      CPLUS_DB_PATH: /data/cplus.db
      CPLUS_LOG_LEVEL: info
      TZ: UTC

    # Published for a direct `docker compose up`. Coolify ignores this and
    # routes through its own proxy using SERVICE_FQDN_CPLUS above, so the
    # service does not need to be reachable on the host.
    ports:
      - "8080:8080"

    volumes:
      # The whole of the service's state is the SQLite file in here: config,
      # users, profiles, actions, permissions, grabs, sessions. It must be a
      # real volume — a bind to an ephemeral path means every redeploy silently
      # resets the service to first-run.
      - cplus-data:/data

    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:'+os.environ['CPLUS_PORT']+'/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  cplus-data:
