[project]
name = "cplus-service"
version = "0.2.0"
description = "Self-hostable service exposing a curated, permissioned subset of Prowlarr to Seerr users"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "greenlet>=3.1",
    "httpx>=0.28",
    "pydantic>=2.10",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "respx>=0.22",
    "asgi-lifespan>=2.1",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cplus_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Alembic autogenerates these; don't reformat machine-written migrations.
"migrations/versions/*.py" = ["E501"]
