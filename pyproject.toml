[project]
name = "cplus-service"
version = "1.0.0"
description = "Self-hostable service exposing a curated, permissioned subset of Prowlarr to Seerr users"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.115",
    # Not uvicorn[standard]: its file watcher, websockets, YAML and .env
    # support are for development and other apps, and cost memory and image
    # size here. uvloop and httptools are the two parts that make serving
    # cheaper; uvloop has no Windows build, where uvicorn falls back to asyncio.
    "uvicorn>=0.34",
    "uvloop>=0.21; sys_platform != 'win32'",
    "httptools>=0.6",
    "greenlet>=3.1",
    # Plain httpx. Push goes through a relay that holds the APNs signing key,
    # so nothing here speaks to Apple: no HTTP/2 requirement, and no
    # `cryptography` to sign a provider token with. Both were dependencies of
    # this service until the relay took the key.
    "httpx>=0.28",
    # httpx's own CA bundle, named directly because cplus_service.tls builds
    # the one TLS context every client shares from it.
    "certifi>=2024.2",
    "jinja2>=3.1",
    "python-multipart>=0.0.20",
    "pydantic>=2.10",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "respx>=0.22",
    "asgi-lifespan>=2.1",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cplus_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.coverage.run]
source = ["src/cplus_service"]
# SQLAlchemy's async layer switches greenlets on every await, which drops
# coverage's trace function and reports everything after the first await in a
# coroutine as unreached. Without this, real coverage reads ~11 points low and
# whole handler bodies look dead when they are exercised.
concurrency = ["greenlet", "thread"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Alembic autogenerates these; don't reformat machine-written migrations.
"migrations/versions/*.py" = ["E501"]
