# Top of the Actions page, red line shown when the download clients could not be fetched from Prowlarr.
[client_error]
text = '''Download clients unavailable: {{ client_error }}'''

# Actions page, red line shown when no quality profile exists yet.
[no_profiles]
text = '''At least one quality profile is required to create an action.'''

# Actions page, grey hint above the list of action cards, about dragging to reorder.
[reorder_hint]
text = '''
Drag to reorder. The first two appear directly on a movie detail page and the rest are placed in an overflow menu.
'''

# Actions page, first hint below the list, explaining the Icon field.
[icon_hint]
text = '''
<strong>Icon</strong> must be an SF Symbol (tvOS 18.6+). Invalid symbols default to <code>arrow.down.circle</code>.
'''

# Actions page, second hint below the list, explaining Name versus Button title.
[name_hint]
text = '''
<strong>Name</strong> is the admin-facing action action name and should be unique and descriptive.<br>
<strong>Button title</strong> is the user-facing button title in Canopy+.<br>
<strong>Example</strong> Name an action "Add best streaming Dolby Vision for 30 days" with title "Stream Now"
'''
