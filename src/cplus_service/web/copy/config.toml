# Configuration page: help text under the "Preferred indexer" dropdown.
[preferred_indexer]
# Dropdown text before the indexer list loads
loading = '''Loading indexers…'''
hint = '''
Applies to every quality profile. When set, a search is scored against this
indexer's results if it returned any, and falls back to all indexers if it
returned none.
'''

# Configuration page: help text under the TMDB "Bearer token" field.
[tmdb_token]
hint = '''
{% if config.tmdb_bearer_token %}A token is saved. Leave blank to keep it.{% else %}Not set yet.{% endif %}
A TMDB v4 read-access token. Unlike the keys above, this one is readable
over the API (<code>GET /manager/tmdb-token</code>) by anyone who can
manage requests, because the admin app needs it to look titles up — fine
for a low-impact, easily rotated key, not a place to put anything more
sensitive.
'''

# Configuration page, Seerr section: shown in place of the Seerr host when none is configured.
[seerr_host]
unset = '''CPLUS_SEERR_URL must be set as an environment var.'''

# Button under the Prowlarr fields
[verify_button]
label = '''Verify Prowlarr connection'''
