{% if error %}
  <option value="" disabled selected>— {{ error }} —</option>
{% else %}
  {% for client in clients %}
    <option value="{{ client.id }}" {% if selected == client.id %}selected{% endif %}>
      {{ client.name }}{% if not client.enable %} {{ t('partials_download_client_options.disabled.text') }}{% endif %}
    </option>
  {% endfor %}
  {% if not clients %}<option value="" disabled selected>{{ t('partials_download_client_options.none.text') }}</option>{% endif %}
{% endif %}
