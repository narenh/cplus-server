{# Swaps in the whole Carousel section after each toggle, not just itself:
   the "enabled" switch's own state decides whether the row below it shows
   at all, so a narrower swap (reflecting only what was clicked, the way
   partials/notification_toggle.html's does) would leave that row stale. #}
<input type="checkbox" name="enabled"
       {% if checked %}checked{% endif %}
       hx-post="{{ url }}"
       hx-target="#carousel-section"
       hx-swap="outerHTML"
       aria-label="{{ label }}">
